services:
  db:
    image: pgvector/pgvector:pg16
    # Come back with Docker after a restart or sign-in, for scheduled news polls.
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkischeap
      POSTGRES_PASSWORD: talkischeap
      POSTGRES_DB: talkischeap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkischeap -d talkischeap"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the migrations before the API starts.
  migrate:
    build: .
    image: talk-is-cheap
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://talkischeap:talkischeap@db:5432/talkischeap
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: talk-is-cheap
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://talkischeap:talkischeap@db:5432/talkischeap
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  cache:
