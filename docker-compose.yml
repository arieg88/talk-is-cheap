services:
  db:
    image: pgvector/pgvector:pg16
    # Come back with Docker after a restart or sign-in, for scheduled news polls.
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkischeap
      POSTGRES_PASSWORD: talkischeap
      POSTGRES_DB: talkischeap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkischeap -d talkischeap"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the migrations before the API starts.
  migrate:
    build: .
    image: talk-is-cheap
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://talkischeap:talkischeap@db:5432/talkischeap
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: talk-is-cheap
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://talkischeap:talkischeap@db:5432/talkischeap
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The web UI, a client of the API: it calls http://api:8080 from inside the network,
  # with UI_API_KEY from .env, so neither the API nor its key is exposed to browsers.
  ui:
    build: .
    image: talk-is-cheap
    command: ["talk-is-cheap", "ui", "--host", "0.0.0.0", "--port", "8501"]
    env_file:
      - path: .env
        required: false
    environment:
      UI_API_URL: http://api:8080
    ports:
      - "${UI_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  cache:
