# Publisher archives searched by `talk-is-cheap ingest archives`: interview-heavy outlets
# whose past articles are read from Common Crawl and the Wayback Machine. How each
# publisher's URLs were checked, and what the search found, is in docs/news.md.
#
# Per publisher:
#   key        short name, used by --publishers and in feed keys
#   publisher  the name stored on its articles
#   domain     the host its articles live on
#   deferred   true: searched and downloaded after every other publisher
#   common_crawl  search Common Crawl's index for the publisher's URLs (default true).
#              Off for every publisher below: their robots.txt keeps Common Crawl's
#              crawler out (CNBC's and Yahoo's name CCBot), so after early 2024 the crawls
#              hold almost none of their articles (docs/news.md, section 9). Common Crawl
#              is still used to read WARC records and as the article-text fallback.
#   patterns   one per URL format the publisher uses:
#     path     a URL path prefix to search. {year}, {month} (two digits) and {m} (no
#              leading zero) expand to every month since --since; {term} to each
#              company's ticker, name and aliases (a slug that starts with one of
#              them). Common Crawl searches the path up to its first placeholder; the
#              Wayback Machine expands every placeholder.
#     article  a regular expression a URL path must match to be an article (not a
#              section page, video or tag page)
#     date     a regular expression with named groups year, month and (optionally) day
#              that reads the publication date from the path; omitted when the URL
#              carries no date
#
# A URL is downloaded only when its slug (the article's last path segment, words split
# on "-" and "_") names a company of universe.yaml (ticker, name, alias) or one of its
# executives, contains one of the claim words below, and contains none of the company's
# exclude_phrases.

claim_words: [says, said, interview, ceo, cfo, expects, plans, predicts, targets, will,
              forecast, promises, vows]

publishers:
  - key: cnbc
    publisher: CNBC
    domain: www.cnbc.com
    common_crawl: false
    patterns:
      - path: "/{year}/{month}/"
        article: '^/\d{4}/\d{2}/\d{2}/[a-z0-9-]+\.html$'
        date: '^/(?P<year>\d{4})/(?P<month>\d{2})/(?P<day>\d{2})/'

  - key: fortune
    publisher: Fortune
    domain: fortune.com
    common_crawl: false
    patterns:
      - path: "/{year}/{month}/"
        article: '^/\d{4}/\d{2}/\d{2}/[a-z0-9-]+/?$'
        date: '^/(?P<year>\d{4})/(?P<month>\d{2})/(?P<day>\d{2})/'

  - key: businessinsider
    publisher: Business Insider
    domain: www.businessinsider.com
    common_crawl: false
    patterns:
      # "/nvidia-ceo-jensen-huang-says-ai-2024-5": the slug ends in the year and month.
      - path: "/{term}"
        article: '^/[a-z0-9-]+-20\d\d-\d{1,2}$'
        date: '-(?P<year>20\d\d)-(?P<month>\d{1,2})$'

  - key: theverge
    publisher: The Verge
    domain: www.theverge.com
    common_crawl: false
    patterns:
      # "/2025/1/1/24333454/elon-musk-...": until early 2025.
      - path: "/{year}/{m}/"
        article: '^/\d{4}/\d{1,2}/\d{1,2}/\d+/[a-z0-9-]+$'
        date: '^/(?P<year>\d{4})/(?P<month>\d{1,2})/(?P<day>\d{1,2})/'
      # "/news/1000532/microsoft-copilot-...": a section and an id; no date.
      - path: "/news/"
        article: '^/news/\d{6,}/[a-z0-9-]+$'

  - key: techcrunch
    publisher: TechCrunch
    domain: techcrunch.com
    common_crawl: false
    patterns:
      - path: "/{year}/{month}/"
        article: '^/\d{4}/\d{2}/\d{2}/[a-z0-9-]+/?$'
        date: '^/(?P<year>\d{4})/(?P<month>\d{2})/(?P<day>\d{2})/'

  - key: arstechnica
    publisher: Ars Technica
    domain: arstechnica.com
    common_crawl: false
    # Five sections searched month by month: searched and downloaded after the others.
    deferred: true
    patterns:
      - path: "/gadgets/{year}/{month}/"
        article: &ars '^/[a-z-]+/\d{4}/\d{2}/[a-z0-9-]+/?$'
        date: &ars_date '^/[a-z-]+/(?P<year>\d{4})/(?P<month>\d{2})/'
      - path: "/ai/{year}/{month}/"
        article: *ars
        date: *ars_date
      - path: "/information-technology/{year}/{month}/"
        article: *ars
        date: *ars_date
      - path: "/tech-policy/{year}/{month}/"
        article: *ars
        date: *ars_date
      - path: "/cars/{year}/{month}/"
        article: *ars
        date: *ars_date

  - key: tomshardware
    publisher: Tom's Hardware
    domain: www.tomshardware.com
    common_crawl: false
    patterns:
      # "/pc-components/gpus/nvidia-...": sections, then the slug; no date.
      - path: "/pc-components/"
        article: &toms '^/(?:[a-z0-9-]+/){1,3}[a-z0-9-]{20,}$'
      - path: "/tech-industry/"
        article: *toms
      - path: "/laptops/"
        article: *toms
      - path: "/desktops/"
        article: *toms

  - key: theregister
    publisher: The Register
    domain: www.theregister.com
    common_crawl: false
    patterns:
      # "/2024/05/23/nvidia_q1_2025/": words joined by underscores.
      - path: "/{year}/{month}/"
        article: '^/\d{4}/\d{2}/\d{2}/[a-z0-9_]+/?$'
        date: '^/(?P<year>\d{4})/(?P<month>\d{2})/(?P<day>\d{2})/'

  - key: marketwatch
    publisher: MarketWatch
    domain: www.marketwatch.com
    common_crawl: false
    patterns:
      # "/story/nvidia-...-04fb6eb1": a hexadecimal id; older slugs end in the date.
      - path: "/story/{term}"
        article: '^/story/[a-z0-9-]+$'
        date: '-(?P<year>20\d\d)-(?P<month>\d{2})-(?P<day>\d{2})$'

  - key: yahoo
    publisher: Yahoo Finance
    domain: finance.yahoo.com
    common_crawl: false
    patterns:
      # "/news/nvidia-1-huge-competitive-advantage-125746289.html": a numeric id; no date.
      - path: "/news/{term}"
        article: '^/news/[a-z0-9-]+-\d{6,}\.html$'
