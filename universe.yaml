# Companies and history covered by ingestion.
# To add a company, add its ticker here and run `talk-is-cheap ingest edgar --tickers NEW`.
# An earlier `history_start` loads more history on the next ingestion run.
#
# News fields, per company:
#   name             the name the press uses; news is matched by it and needs it
#   aliases          other names that mean the company ("Google" for Alphabet)
#   exclude_phrases  phrases in which a name means something else ("Big Apple")
#   news_only: true  collect news without loading filings yet. RSS history cannot be
#                    backfilled later, so list a company here before its filings are
#                    needed; remove the flag to load its filings.
#   gdelt_filter_publishers: true
#                    GDELT backfill searches only the publishers in feeds.yaml. Set for
#                    names that are common words or heavily covered, whose unfiltered
#                    searches return mostly articles that are dropped (docs/news.md).
#   executives      management by role, with start and end dates (omitted: before the
#                    history start, or still in the role). A statement in the news counts
#                    as management's only if its speaker held a role on its date. Each
#                    company's roster cites the filings it comes from.
# Names and aliases match with their own capitalization, Title Case or UPPER CASE, as
# whole words; a lower-case "apple" or "meta" is never a match.

history_start: 2024-01-01

# SEC form types to record in the filings index.
forms:
  - 10-K
  - 10-K/A
  - 10-Q
  - 10-Q/A
  - 8-K
  - 8-K/A

companies:
  - ticker: AAPL
    name: Apple
    gdelt_filter_publishers: true
    exclude_phrases: [Big Apple, Apple pie, Apple cider, Apple orchard, Apple Valley,
                      Apple Hospitality, Apple Bank, Candy Apple, Adam's Apple, Apple picking,
                      Apple festival]
