[project]
name = "talk-is-cheap"
version = "0.1.0"
description = "Holds executives to what they say in public: claims from interviews and press statements, judged against what actually happened."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "edgartools>=5.62.0",
    "fastembed>=0.9.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "lxml>=6.1.3",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1",
    "sqlglot>=30.23.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
talk-is-cheap = "talk_is_cheap.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations keep long SQL expressions on one line.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["talk_is_cheap"]
# The local alembic/ migrations folder would otherwise shadow the alembic package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["talk_is_cheap"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pgvector.*", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs a running Postgres database (DATABASE_URL)",
]
