[project]
name = "talk-is-cheap"
version = "0.1.0"
description = "An AI analyst that compares what public companies say with what they report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
]

[project.scripts]
talk-is-cheap = "talk_is_cheap.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["talk_is_cheap"]
# The local alembic/ migrations folder would otherwise shadow the alembic package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["talk_is_cheap"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs a running Postgres database (DATABASE_URL)",
]
